name: Release

# Every merge (push) to main ships a new version:
#   verify -> compute next semver from conventional commits + update CHANGELOG.md -> tag
#   -> build installers on Windows / macOS / Linux -> publish a GitHub Release with the changelog.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  verify:
    name: Verify
    # The release job's own version-bump commit must not trigger another release.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  version:
    name: Version & changelog
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.prepare.outputs.released }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for commit analysis
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compute next version and update CHANGELOG.md
        id: prepare
        run: node scripts/release/prepare.mjs

      - name: Commit, tag and push
        if: steps.prepare.outputs.released == 'true'
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/desktop/package.json CHANGELOG.md
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "${TAG}" -m "Hive ${TAG}"
          # If main is protected the commit push may be rejected; the tag (pointing at the release
          # commit) is what the build uses, so push it regardless.
          git push origin HEAD:main || echo "::warning::Could not push the release commit to main (branch protection?). Tag will still be published."
          git push origin "${TAG}"

      - name: Upload release notes
        if: steps.prepare.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build:
    name: Package (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Package installers
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned builds; no certificates in CI
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist-release/*.exe
            apps/desktop/dist-release/*.dmg
            apps/desktop/dist-release/*.zip
            apps/desktop/dist-release/*.AppImage
            apps/desktop/dist-release/latest*.yml

  publish:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Hive ${{ needs.version.outputs.tag }}
          body_path: artifacts/release-notes/RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            artifacts/dist-*/*.exe
            artifacts/dist-*/*.dmg
            artifacts/dist-*/*.zip
            artifacts/dist-*/*.AppImage
